# CI for the React app under react/: format, lint, unit tests with coverage gates, build and Playwright e2e.
# Firebase deploy of react/dist stays on Travis (.travis.yml).
name: React CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: react-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: react

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: react/coverage
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: react/playwright-report
          retention-days: 7
