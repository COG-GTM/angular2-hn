language: node_js
node_js:
  - "20"

cache: npm

branches:
  only:
    - master

install:
  - npm ci

before_script:
  - npm install -g firebase-tools

script:
  - npm run lint
  - npm run typecheck
  - npm test
  - npm run build

after_success:
  - firebase use default
  - firebase deploy --only hosting,database --token $FIREBASE_TOKEN

notifications:
  email:
    on_failure: change
    on_success: change
