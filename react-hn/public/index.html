<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>React HN</title>

  <meta name="description" content="A Hacker News client built with React, TypeScript and React Router"/>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#b92b27">

  <meta name="msapplication-TileColor" content="#b92b27">
  <meta name="msapplication-TileImage" content="%PUBLIC_URL%/assets/icons/mstile-150x150.png">
  <meta name="msapplication-config" content="%PUBLIC_URL%/assets/icons/browserconfig.xml">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <link rel="manifest" href="%PUBLIC_URL%/manifest.json">
  <link rel="mask-icon" href="%PUBLIC_URL%/assets/icons/safari-pinned-tab.svg" color="#b92b27">

  <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico">
  <link rel="icon" type="image/png" href="%PUBLIC_URL%/assets/icons/favicon-32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="%PUBLIC_URL%/assets/icons/favicon-16x16.png" sizes="16x16">

  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/assets/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="120x120" href="%PUBLIC_URL%/assets/icons/apple-touch-icon-120x120.png">
  <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/assets/icons/apple-touch-icon-152x152.png">

  <style>
    #skip a { position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden; }
    #skip a:focus { position: static; width: auto; height: auto; }
  </style>
</head>
<body>
  <div id="skip"><a href="#content">skip to navigation</a></div>
  <div id="root"></div>

  <div class="app-loader" id="content">
    <img class="logo" src="%PUBLIC_URL%/assets/images/logo.svg" alt="Logo">

    <noscript>
      <h4 style="font-family: 'HelveticaNeue-Light', 'Helvetica Neue Light', 'Helvetica Neue', Helvetica;">
        Sorry, JavaScript needs to be enabled in order to run this application.
      </h4>
    </noscript>
  </div>
</body>
</html>
