name: React app
on:
  push:
    paths: ['react-app/**', '.github/workflows/react-app.yml']
  pull_request:
    paths: ['react-app/**', '.github/workflows/react-app.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
