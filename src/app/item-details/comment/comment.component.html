@let c = comment();
@if (!c.deleted) {
  <div>
    <div class="meta" [class.meta-collapse]="collapse()">
      <span class="collapse" role="button" tabindex="0" [attr.aria-expanded]="!collapse()" (click)="toggleCollapse()"
        (keydown.enter)="toggleCollapse()">[{{ collapse() ? '+' : '-' }}]</span>
      <a [routerLink]="['/user', c.user]" routerLinkActive="active">{{ c.user }}</a>
      <span class="time">{{ c.time_ago }}</span>
    </div>
    <div class="comment-tree">
      <div [hidden]="collapse()">
        <p class="comment-text" [innerHTML]="c.content"></p>
        <ul class="subtree">
          @for (subComment of c.comments; track subComment.id) {
            <li>
              <app-comment [comment]="subComment"></app-comment>
            </li>
          }
        </ul>
      </div>
    </div>
  </div>
} @else {
  <div>
    <div class="deleted-meta">
      <span class="collapse">[deleted]</span> | Comment Deleted
    </div>
  </div>
}
