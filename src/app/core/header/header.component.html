<header>
    <div id="header">
        <a class="home-link" routerLink="/dashboard" (click)="scrollTop()" aria-label="Vantage home">
            <img class="logo" src="assets/images/logo.svg" alt="Vantage" />
        </a>
        <div class="header-text">
            <span class="brand">Vantage</span>
            <span class="rate-pill">4% cash back</span>
            <nav class="header-nav" aria-label="Primary">
                <a routerLink="/dashboard" routerLinkActive="active" (click)="scrollTop()">dashboard</a>
                <span class="divider">|</span>
                <a routerLink="/transactions" routerLinkActive="active" (click)="scrollTop()">transactions</a>
                <span class="divider">|</span>
                <a routerLink="/rewards" routerLinkActive="active" (click)="scrollTop()">rewards</a>
                <span class="divider">|</span>
                <a routerLink="/account" routerLinkActive="active" (click)="scrollTop()">card</a>
            </nav>
        </div>
        <div class="info">
            <button type="button" class="settings-button" (click)="toggleSettings()" aria-label="Open settings">
                <img class="settings" src="assets/images/cog.svg" alt="" />
            </button>
        </div>
    </div>
    @if (settings().showSettings) {
        <app-settings />
    }
</header>
