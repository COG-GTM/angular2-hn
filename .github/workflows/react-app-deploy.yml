name: react-app deploy (Firebase Hosting)

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: react-app-deploy
    cancel-in-progress: false

env:
    # Angular's .firebaserc default project; override with the FIREBASE_PROJECT_ID repository variable.
    FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'angular2-hn' }}

jobs:
    credentials:
        name: check Firebase credentials
        runs-on: ubuntu-latest
        outputs:
            available: ${{ steps.check.outputs.available }}
        steps:
            - id: check
              env:
                  FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
                  FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
              run: |
                  if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || [ -n "$FIREBASE_TOKEN" ]; then
                      echo "available=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "available=false" >> "$GITHUB_OUTPUT"
                      echo "::notice::FIREBASE_SERVICE_ACCOUNT / FIREBASE_TOKEN secret not set; skipping Firebase deploy."
                  fi

    deploy:
        name: build and deploy
        needs: credentials
        if: needs.credentials.outputs.available == 'true'
        runs-on: ubuntu-latest
        environment: production
        defaults:
            run:
                working-directory: react-app
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: react-app/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
            - name: Deploy to Firebase Hosting
              env:
                  FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
                  FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
              run: |
                  if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
                      export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
                      printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
                      unset FIREBASE_TOKEN
                  fi
                  npx --yes firebase-tools@15 deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
