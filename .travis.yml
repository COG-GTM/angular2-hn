language: node_js
node_js:
  - "20"

cache:
  npm: true

branches:
  only:
    - master

install:
  - npm ci

script:
  - npm run lint
  - npm run build

before_script:
  - npm install -g firebase-tools

after_success:
  - firebase use default
  - firebase deploy --token $FIREBASE_TOKEN

notifications:
  email:
    on_failure: change
    on_success: change
