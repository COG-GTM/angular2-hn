language: node_js
node_js:
  - "18"

branches:
  only:
    - master

before_script:
  - npm install -g firebase-tools
  - npm install -g @angular/cli
  - npm install --prefix react

script:
  # Angular build (legacy OpenSSL provider required for Angular 9 on Node 17+)
  - NODE_OPTIONS=--openssl-legacy-provider npm run build
  # React build (parity target, not yet the live deploy)
  - npm run build:react

after_success:
  # Angular remains the live Firebase deploy until parity cutover.
  - firebase use default
  - firebase deploy --token $FIREBASE_TOKEN
  # React cutover (enable once a react hosting site is provisioned):
  # - firebase deploy --config firebase.react.json --token $FIREBASE_TOKEN

notifications:
  email:
    on_failure: change
    on_success: change
