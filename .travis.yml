language: node_js
node_js:
  - "20"

branches:
  only:
    - master

before_script:
  - npm install -g firebase-tools
  - cd react-app && npm ci && cd ..

script:
  - cd react-app && npm run lint && npm test && npm run build && cd ..

after_success:
  - firebase use default
  - firebase deploy --token $FIREBASE_TOKEN

notifications:
  email:
    on_failure: change
    on_success: change
