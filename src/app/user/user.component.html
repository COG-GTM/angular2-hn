@let user = state().data;
@if (user) {
  <div class="profile">
    <div class="mobile item-header">
      <p class="title-block">
        <span class="back-button" role="button" tabindex="0" aria-label="Back" (click)="goBack()" (keydown.enter)="goBack()"></span>
        Profile: {{ user.id }}
      </p>
    </div>
    <div class="main-details">
      <span class="name">{{ user.id }}</span>
      <span class="right">{{ user.karma }} ★</span>
      <p class="age">Created {{ user.created }}</p>
    </div>
    @if (user.about) {
      <div class="other-details">
        <p [innerHTML]="user.about"></p>
      </div>
    }
  </div>
} @else if (state().error) {
  <app-error-message [message]="state().error"></app-error-message>
} @else {
  <app-loader></app-loader>
}
