language: node_js
node_js:
  - "20"

branches:
  only:
    - master

install:
  - npm --prefix react-app ci

script:
  - npm --prefix react-app run build
  - npm --prefix react-app test

after_success:
  - npm install -g firebase-tools
  - firebase use default
  - firebase deploy --token $FIREBASE_TOKEN

notifications:
  email:
    on_failure: change
    on_success: change
