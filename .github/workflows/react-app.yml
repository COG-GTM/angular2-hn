name: react-app

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: react-app-dist
          path: react-app/dist

  parity:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: parity/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: react-app-dist
          path: react-app/dist
      - run: npm ci
        working-directory: parity
      - run: npx playwright install --with-deps chromium
        working-directory: parity
      - name: Serve react-app build
        run: node parity/serve.mjs react-app/dist 4300 &
      - run: npx playwright test --project=react
        working-directory: parity
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parity-report
          path: parity/playwright-report
