language: node_js
node_js:
  - "22"

branches:
  only:
    - master

cache:
  npm: true
  directories:
    - $HOME/.cache/ms-playwright

before_install:
  - npm install -g npm@11
  - cd react-app

install:
  - npm ci

before_script:
  - npx playwright install --with-deps chromium

script:
  - npm run lint
  - npm run typecheck
  - npm test
  - npm run build
  - npm run e2e

before_deploy:
  - cd ..
  - npm install -g firebase-tools

deploy:
  provider: script
  skip_cleanup: true
  script: firebase use default && firebase deploy --only hosting --token $FIREBASE_TOKEN
  on:
    branch: master
