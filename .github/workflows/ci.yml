name: CI

on:
    pull_request:
    push:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: lint, typecheck, test, build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm run typecheck
            - run: npm test
            - run: npm run build

    e2e:
        name: e2e (Playwright, prod build + vite preview)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium
            - name: Build
              run: npm run build
            # playwright.config.ts's webServer rebuilds and serves the build with `vite preview`.
            - name: Run e2e
              run: npm run e2e
            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 14
                  if-no-files-found: ignore
