language: node_js
node_js:
  - "20"

branches:
  only:
    - master

before_script:
  - npm install -g firebase-tools

install:
  - npm ci
  - npx playwright install --with-deps chromium

script:
  - npm run lint
  - npm test
  - npm run build
  - npm run e2e

after_success:
  - firebase use default
  - firebase deploy --token $FIREBASE_TOKEN

notifications:
  email:
    on_failure: change
    on_success: change
