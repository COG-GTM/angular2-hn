name: react-app CI

on:
    pull_request:
    push:

permissions:
    contents: read

concurrency:
    group: react-app-ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        name: lint, typecheck, test, build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: react-app
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: react-app/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm run typecheck
            - run: npm test
            - run: npm run build

    e2e:
        name: e2e (Playwright, prod build + vite preview)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        defaults:
            run:
                working-directory: react-app
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: react-app/package-lock.json
            - run: npm ci
            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium
            # playwright.config.ts's webServer runs `npm run build && npm run preview`.
            - name: Run e2e
              run: npm run e2e
            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      react-app/playwright-report/
                      react-app/test-results/
                  retention-days: 14
                  if-no-files-found: ignore

    deploy:
        name: deploy to Firebase Hosting (master, only when credentials are set)
        needs: [build, e2e]
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        # Credentials are checked inside the job so production-environment secrets are visible to the check.
        environment: production
        env:
            FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
            FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
            # Angular's .firebaserc default project; override with the FIREBASE_PROJECT_ID repository variable.
            FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'angular2-hn' }}
        defaults:
            run:
                working-directory: react-app
        steps:
            - name: Check Firebase credentials
              id: credentials
              working-directory: .
              run: |
                  if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || [ -n "$FIREBASE_TOKEN" ]; then
                      echo "available=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "available=false" >> "$GITHUB_OUTPUT"
                      echo "::notice::FIREBASE_SERVICE_ACCOUNT / FIREBASE_TOKEN secret not set; skipping Firebase deploy."
                  fi
            - if: steps.credentials.outputs.available == 'true'
              uses: actions/checkout@v4
            - if: steps.credentials.outputs.available == 'true'
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: react-app/package-lock.json
            - if: steps.credentials.outputs.available == 'true'
              run: npm ci && npm run build
            - name: Deploy to Firebase Hosting
              if: steps.credentials.outputs.available == 'true'
              run: |
                  if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
                      export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
                      printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
                      unset FIREBASE_TOKEN
                  fi
                  npx --yes firebase-tools@15 deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
