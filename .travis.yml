language: node_js
node_js:
  - "20"

branches:
  only:
    - master

script:
  - npm ci
  - npm run lint
  - npm test
  - npm run build

after_success:
  - npm install -g firebase-tools
  - firebase use default
  - firebase deploy --token $FIREBASE_TOKEN

notifications:
  email:
    on_failure: change
    on_success: change
