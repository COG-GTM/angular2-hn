name: CI

on:
  pull_request:
  push:
    branches: [master, devin/angular21-base]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Production build (with service worker)
        run: npm run build
      - name: Check the service worker was emitted
        run: test -f dist/angular-hnpwa/browser/ngsw-worker.js && test -f dist/angular-hnpwa/browser/ngsw.json
      - name: Unit tests
        run: npm test -- --watch=false
