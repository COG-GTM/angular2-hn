name: React CI

on:
    push:
        paths:
            - 'react/**'
    pull_request:
        paths:
            - 'react/**'

jobs:
    react:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: react
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: react/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm run build
            - run: npm test
