name: react-app

on:
  pull_request:
    paths:
      - 'react-app/**'
      - '.github/workflows/react-app.yml'
  push:
    branches: [master]
    paths:
      - 'react-app/**'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
